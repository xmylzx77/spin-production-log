                  - lblTurNoGauges:
                      Control: Label@2.5.1
                      Properties:
                        Color: =clrAmber
                        FontWeight: =FontWeight.Semibold
                        Height: =64
                        PaddingLeft: =0
                        Size: =16
                        Text: ="No gauges selected"
                        Visible: =ThisItem.NeedCount = 0
                        Width: =240
                        Wrap: =false
                        X: =20
                        Y: =74
                  - lblTurNest:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(IsBlank(ThisItem.NestLabel), clrMuted, clrText)
                        FontWeight: =If(IsBlank(ThisItem.NestLabel), FontWeight.Normal, FontWeight.Bold)
                        Height: =64
                        Italic: =IsBlank(ThisItem.NestLabel)
                        PaddingLeft: =0
                        Size: =18
                        Text: =If(IsBlank(ThisItem.NestLabel), "no nest label", ThisItem.NestLabel)
                        Width: =Parent.Width - Self.X - 200
                        X: =28 + If(ThisItem.NeedCount = 0, 240, ThisItem.NeedCount * 140)
                        Y: =74
                  - lblTurComplete:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =clrGreen
                        FontWeight: =FontWeight.Bold
                        Height: =64
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =18
                        Text: |-
                          ="✓ Complete"
                        Visible: =ThisItem.TurretDone
                        Width: =170
                        Wrap: =false
                        X: =Parent.Width - Self.Width - 20
                        Y: =74
      - lblTurEmpty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =clrMuted
            Height: =110
            Size: =18
            Text: |-
              =If(tglTurShowDone.Value, "No nested jobs on " & lblTurMachine.Text & ".", "Nothing waiting on " & lblTurMachine.Text & " right now.") &
              Char(10) & "Jobs show here once the supervisor puts them on " & lblTurMachine.Text & " and they are marked Nested."
            Visible: |-
              =IsEmpty(Filter(ActiveJobs, MachineText = lblTurMachine.Text && Nested && (tglTurShowDone.Value || !TurretDone)))
            Width: =1366
            X: =0
            Y: =220
      - tmrTurRefresh:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =true
            AutoStart: =true
            Duration: =30000
            OnTimerEnd: |-
              =Refresh(TheWhiteBoard);
              Set(gblRefreshTick, gblRefreshTick + 1)
            Repeat: =true
            Visible: =false
