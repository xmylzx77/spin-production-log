                        Y: =74
                  - btnTurG24:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =clrPage
                        DisabledColor: =clrPage
                        DisabledFill: =ColorFade(If(ThisItem.Done24, clrGreen, clrYellow), -40%)
