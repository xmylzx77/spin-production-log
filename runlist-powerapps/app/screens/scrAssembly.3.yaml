- btnAsmMoved:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =clrPage
      DisabledColor: =Self.Color
      DisabledFill: =ColorFade(Self.Fill, -30%)
      Fill: =clrAmber
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Bold
      Height: =26
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =With({id: ThisItem.Job.ID, seen: ThisItem.Job.ShipYmd},
        With({cur: LookUp(TheWhiteBoard, ID = id)},
            // An import can move the ship date again and keep the first PrevShipDate.
            // Only clear the flag for the ship date this card is showing.
            If(
                If(IsBlank(cur.ShipDate), "", Text(cur.ShipDate, "yyyy-mm-dd")) <> seen,
                Notify("CASMFG moved this ship date again. Check the new date on the card, then tap the chip again.", NotificationType.Warning);
                Refresh(TheWhiteBoard);
                Set(gblRefreshTick, gblRefreshTick + 1),
                IfError(
                    Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {PrevShipDate: Blank()}),
                    Refresh(TheWhiteBoard);
                    IfError(
                        Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {PrevShipDate: Blank()}),
                        Notify("Save failed: " & FirstError.Message, NotificationType.Error, 0),
                        true
                    ),
                    true
                )
            )
        ))
      PaddingLeft: =0
      PaddingRight: =0
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =13
      RadiusBottomRight: =13
      RadiusTopLeft: =13
      RadiusTopRight: =13
      Size: =10
      Text: |-
        ="📅 was " & ThisItem.Job.PrevShipText
      Tooltip: ="CASMFG moved the ship date. Tap to acknowledge."
      Visible: =ThisItem.Job.PrevShipText <> ""
      Width: =92
      X: =Parent.Width - Self.Width - 4
      Y: =36
- btnAsmStarted:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =If(ThisItem.Job.Started, clrPage, clrText)
      DisabledColor: =Self.Color
      DisabledFill: =ColorFade(Self.Fill, -30%)
      Fill: =If(ThisItem.Job.Started, clrGreen, clrGrey)
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Bold
      Height: =56
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =With({id: ThisItem.Job.ID, v: !ThisItem.Job.Started},
        // If another tablet already started this job, keep its StartedOn, so the
        // 30-day housekeeping clock is not restarted by a stale Start tap.
        With({so: If(v, With({cur: LookUp(TheWhiteBoard, ID = id)}, If(cur.Started && !IsBlank(cur.StartedOn), cur.StartedOn, Today())), Blank())},
            IfError(
                Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {Started: v, StartedOn: so}),
                Refresh(TheWhiteBoard);
                IfError(
                    Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {Started: v, StartedOn: so}),
                    Notify("Save failed: " & FirstError.Message, NotificationType.Error, 0),
                    true
                ),
                true
            )
        ))
      PaddingLeft: =4
      PaddingRight: =4
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Size: =13
      Text: |-
        =If(ThisItem.Job.Started, "✓ Started " & Text(ThisItem.Job.StartedOn, "m/d"), "Start")
      Width: =124
      X: =12
      Y: =66
