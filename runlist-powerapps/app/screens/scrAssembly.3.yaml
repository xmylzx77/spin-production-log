- btnAsmUp:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =clrText
      DisabledColor: =Self.Color
      DisabledFill: =ColorFade(Self.Fill, -30%)
      Fill: =clrBorder
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Bold
      Height: =48
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -15%)
      OnSelect: |-
        =With({c: ThisItem.Job, dir: "up"},
        With({vis: SortByColumns(Filter(ActiveJobs, AsmBand = c.AsmBand && (tglAsmShowStarted.Value || AsmShown)), "AsmGroupOrder", SortOrder.Ascending, "PairKey", SortOrder.Ascending, "AsmSort", SortOrder.Ascending, "ID", SortOrder.Ascending)},
        With({units: Filter(vis As r, IsBlank(r.PairNo) || r.ID = First(Filter(vis, PairNo = r.PairNo)).ID)},
        With({num: ForAll(Sequence(CountRows(units)) As s, {i: s.Value, pn: Index(units, s.Value).PairNo, uid: Index(units, s.Value).ID, go: Index(units, s.Value).AsmGroupOrder})},
        With({my: LookUp(num, If(IsBlank(c.PairNo), uid = c.ID, pn = c.PairNo))},
        With({mover: If(dir = "up", my, LookUp(num, i = my.i + 1)),
              above: If(dir = "up", LookUp(num, i = my.i - 1), my),
              above2: If(dir = "up", LookUp(num, i = my.i - 2), LookUp(num, i = my.i - 1))},
        If(!IsBlank(mover) && !IsBlank(above),
            With({id: First(SortByColumns(Filter(ActiveJobs, AsmBand = c.AsmBand && If(IsBlank(mover.pn), ID = mover.uid, PairNo = mover.pn)), "AsmSort", SortOrder.Ascending, "ID", SortOrder.Ascending)).ID,
                  v: If(IsBlank(above2), above.go - 1, (above2.go + above.go) / 2)},
                IfError(
                    Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {AssemblyOrder: v}),
                    Refresh(TheWhiteBoard);
                    IfError(
                        Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {AssemblyOrder: v}),
                        Notify("Move failed: " & FirstError.Message, NotificationType.Error, 0),
                        true
                    ),
                    true
                )
            )
        )))))))
      PaddingLeft: =0
      PaddingRight: =0
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -30%)
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      RadiusTopLeft: =10
      RadiusTopRight: =10
      Size: =18
      Text: =UniChar(9650)
      Tooltip: ="Move up"
      Width: =48
      X: =Parent.Width - 156
      Y: =70
