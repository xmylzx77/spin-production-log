- lblPunEdPairL:
    Control: Label@2.5.1
    Properties:
      Color: =clrText
      FontWeight: =FontWeight.Semibold
      Height: =26
      PaddingBottom: =0
      PaddingLeft: =0
      PaddingRight: =0
      PaddingTop: =0
      Size: =13
      Text: |-
        ="Pair with job #"
      Width: =140
      Wrap: =false
      X: =24
      Y: =482
- txtPunEdPair:
    Control: Classic/TextInput@2.3.2
    Properties:
      BorderColor: =clrBorder
      BorderThickness: =1
      Color: =clrText
      Default: =""
      DisabledColor: =clrMuted
      DisabledFill: =clrCard
      DisplayMode: |-
        =If(locPunEdMode = "edit" && locPunJob.JobStatus.Value = "Active", DisplayMode.Edit, DisplayMode.Disabled)
      Fill: =clrPage
      FocusedBorderColor: =clrBlue
      FocusedBorderThickness: =2
      Height: =42
      HintText: |-
        ="Job # or job-fan"
      HoverColor: =clrText
      HoverFill: =clrPage
      PressedColor: =clrText
      PressedFill: =clrPage
      Size: =14
      Width: =180
      X: =168
      Y: =474
- btnPunEdPair:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =clrWhite
      DisabledColor: =clrMuted
      DisabledFill: =ColorFade(clrGrey, -40%)
      DisplayMode: |-
        =If(locPunEdMode = "edit" && locPunJob.JobStatus.Value = "Active", DisplayMode.Edit, DisplayMode.Disabled)
      Fill: =clrBlue
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Semibold
      Height: =42
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =With({t: Upper(Trim(txtPunEdPair.Text)), me: LookUp(ActiveJobs, ID = locId)},
        With({hits: Filter(ActiveJobs, ID <> locId && (Upper(JobLabel) = t || Upper(JobNumber & "") = t))},
        With({exact: Filter(hits, Upper(JobLabel) = t)},
        With({cand: If(CountRows(exact) = 1, exact, hits)},
            If(IsBlank(me), Notify("Only active jobs can be paired.", NotificationType.Warning),
                t = "", Notify("Type the job # (or job-fan) to pair with.", NotificationType.Warning),
                IsEmpty(cand), Notify("No active job " & t & " found.", NotificationType.Warning),
                CountRows(cand) > 1, Notify("More than one active job matches " & t & ". Type the full job-fan, for example " & First(cand).JobLabel & ".", NotificationType.Warning),
                // Pair: every job in both groups gets PairNo = the lowest ID among them (list-design).
                With({mate: First(cand)},
                With({grp: Filter(ActiveJobs, ID = me.ID || ID = mate.ID || (!IsBlank(PairNo) && (PairNo = me.PairNo || PairNo = mate.PairNo)))},
                With({newNo: Min(grp, ID)},
                With({todo: Filter(grp, IsBlank(PairNo) || PairNo <> newNo)},
                // Each write gives back the row's ID, or 0 if it failed twice, so a half-done pair is reported.
                With({res: ForAll(Sequence(CountRows(todo)) As s,
                        With({id: Index(todo, s.Value).ID},
                            IfError(
                                Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {PairNo: newNo}).ID,
                                Refresh(TheWhiteBoard);
                                IfError(
                                    Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {PairNo: newNo}).ID,
                                    Notify("Pair failed: " & FirstError.Message, NotificationType.Error, 0);
                                    0
                                )
                            )
                        )
                    )},
                    If(CountIf(res, Value = 0) = 0,
                        Reset(txtPunEdPair);
                        Notify("Paired with " & mate.JobLabel, NotificationType.Success),
                        Notify(CountIf(res, Value = 0) & " job(s) did not pair. Tap Pair again.", NotificationType.Error, 0)
                    )
                )))))
            )
        ))))
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =14
      Text: ="Pair"
      Width: =90
      X: =358
      Y: =474
- btnPunEdUnpair:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =clrText
      DisabledColor: =clrMuted
      DisabledFill: =ColorFade(clrGrey, -40%)
      DisplayMode: |-
        =If(locPunEdMode = "edit" && locPunJob.JobStatus.Value = "Active", DisplayMode.Edit, DisplayMode.Disabled)
      Fill: =clrGrey
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Semibold
      Height: =42
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =With({me: LookUp(ActiveJobs, ID = locId)},
            If(IsBlank(me.PairNo),
                Notify("This job isn't paired.", NotificationType.Information),
                // Unpair clears the whole pair group, as the old board did.
                With({grp: Filter(ActiveJobs, PairNo = me.PairNo)},
                With({res: ForAll(Sequence(CountRows(grp)) As s,
                        With({id: Index(grp, s.Value).ID},
                            IfError(
                                Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {PairNo: Blank()}).ID,
                                Refresh(TheWhiteBoard);
                                IfError(
                                    Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {PairNo: Blank()}).ID,
                                    Notify("Unpair failed: " & FirstError.Message, NotificationType.Error, 0);
                                    0
                                )
                            )
                        )
                    )},
                    If(CountIf(res, Value = 0) = 0,
                        Notify("Pair removed.", NotificationType.Success),
                        Notify(CountIf(res, Value = 0) & " job(s) are still paired. Tap Unpair again, or open that job and tap Unpair.", NotificationType.Error, 0)
                    )
                ))
            )
        )
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =14
      Text: ="Unpair"
      Tooltip: ="Unpair removes the whole pair group"
      Width: =120
      X: =458
      Y: =474
