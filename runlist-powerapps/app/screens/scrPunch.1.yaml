      - tmrPunRefresh:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =true
            AutoStart: =true
            Duration: =60000
            OnTimerEnd: =If(IsBlank(locPanel), Refresh(TheWhiteBoard); Set(gblRefreshTick, gblRefreshTick + 1))
            Repeat: =true
            Visible: =false
      - tmrPunHousekeep:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =true
            AutoStart: =true
            Duration: =600000
            OnTimerEnd: |-
              =With({hk: Filter(ActiveJobs, PunchDone && Started && !IsBlank(StartedOn) && DateDiff(StartedOn, TodayDate, TimeUnit.Days) >= 30)},
                  ForAll(Sequence(CountRows(hk)) As s,
                      With({id: Index(hk, s.Value).ID},
                          IfError(
                              Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {JobStatus: {Value: "Done"}}),
                              Refresh(TheWhiteBoard);
                              IfError(
                                  Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {JobStatus: {Value: "Done"}}),
                                  Notify("Housekeeping could not close a job: " & FirstError.Message, NotificationType.Error, 0),
                                  true
                              ),
                              true
                          )
                      )
                  )
              )
            Repeat: =true
            Visible: =false
