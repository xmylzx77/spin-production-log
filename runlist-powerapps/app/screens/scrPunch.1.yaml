Screens:
  scrPunch:
    Properties:
      Fill: =clrPage
      OnVisible: |-
        =UpdateContext({locPanel: "", locId: 0, locPunJob: If(false, LookUp(TheWhiteBoard, ID = 0)), locPunEdMode: "", locPunEdFrom: "", locPunEdClrPunch: false, locPunEdClrAsm: false, locPunDismissArm: false, locPunSaved: false, locPunPlaceMachine: "SB8", locPunP12: false, locPunP14: false, locPunP16: false, locPunP18: false, locPunP20: false, locPunP24: false, locPunFindText: "", locPunFindHit: false});
        // locPunJob above is a typed blank (no server call): it tells Studio
        // that locPunJob holds one TheWhiteBoard row (the job in the edit panel).
        Refresh(TheWhiteBoard);
        Set(gblRefreshTick, gblRefreshTick + 1);
        // Housekeeping (app-spec, list-design status model 3): a job closes to Done
        // 30 days after the line started it, once punch, PB and P4 are all done.
        // The filter is snapshotted first; ForAll walks a Sequence, not the list.
        With({hk: Filter(ActiveJobs, PunchDone && Started && !IsBlank(StartedOn) && DateDiff(StartedOn, TodayDate, TimeUnit.Days) >= 30)},
            ForAll(Sequence(CountRows(hk)) As s,
                With({id: Index(hk, s.Value).ID},
                    IfError(
                        Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {JobStatus: {Value: "Done"}}),
                        Refresh(TheWhiteBoard);
                        IfError(
                            Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {JobStatus: {Value: "Done"}}),
                            Notify("Housekeeping could not close a job: " & FirstError.Message, NotificationType.Error, 0),
                            true
                        ),
                        true
                    )
                )
            )
        )
    Children:
      - conPunHeader:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =clrCard
            Height: =64
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =10
            LayoutJustifyContent: =LayoutJustifyContent.Start
            PaddingLeft: =16
            PaddingRight: =16
            Width: =1366
            X: =0
            Y: =0
          Children:
            - lblPunTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  FillPortions: =1
                  FontWeight: =FontWeight.Bold
                  Height: =44
                  LayoutMinWidth: =120
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =22
                  Text: ="Punch"
                  Width: =120
                  Wrap: =false
            - lblPunCounts:
                Control: Label@2.5.1
                Properties:
                  Color: =clrMuted
                  FillPortions: =0
                  Height: =44
                  LayoutMinWidth: =310
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: |-
                    ="Jobs: " & With({o: Filter(ActiveJobs, !PunchDone)}, CountRows(o) & "    S1 " & CountRows(Filter(o, JobSize = 1)) & "  S2 " & CountRows(Filter(o, JobSize = 2)) & "  S3 " & CountRows(Filter(o, JobSize = 3)) & "  S4 " & CountRows(Filter(o, JobSize >= 4)))
                  Tooltip: |-
                    ="Open jobs (punch, brake or P4 still to do), then by size: S1 to S4"
                  Width: =310
                  Wrap: =false
            - txtPunFind:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =clrBorder
                  BorderThickness: =1
                  Clear: =true
                  Color: =clrText
                  Default: =""
                  DisabledColor: =clrMuted
                  DisabledFill: =clrCard
                  Fill: =clrPage
                  FillPortions: =0
                  FocusedBorderColor: =clrBlue
                  FocusedBorderThickness: =2
                  Height: =44
                  HintText: |-
                    ="Find job #"
                  HoverColor: =clrText
                  HoverFill: =clrPage
                  LayoutMinWidth: =140
                  PressedColor: =clrText
                  PressedFill: =clrPage
                  Size: =14
                  Tooltip: ="Type a job number, then tap Find"
                  Width: =140
            - btnPunFind:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =clrWhite
                  DisabledColor: =Self.Color
                  DisabledFill: =ColorFade(Self.Fill, -30%)
