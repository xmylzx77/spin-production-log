Screens:
  scrNesting:
    Properties:
      Fill: =clrPage
      OnVisible: |-
        =UpdateContext({locNesHold: 0, locNesSaveKey: ""});
        Refresh(TheWhiteBoard);
        Set(gblRefreshTick, gblRefreshTick + 1)
    Children:
      - conNesHeader:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =clrCard
            Height: =64
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.Start
            PaddingLeft: =16
            PaddingRight: =16
            Width: =1366
            X: =0
            Y: =0
          Children:
            - lblNesTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  FillPortions: =1
                  FontWeight: =FontWeight.Bold
                  Height: =44
                  LayoutMinWidth: =160
                  PaddingLeft: =0
                  Size: =22
                  Text: ="Nesting"
                  Wrap: =false
            - lblNesCounts:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =clrMuted
                  FillPortions: =0
                  Height: =44
                  LayoutMinWidth: =300
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =14
                  Text: |-
                    =With(
                        {open: Filter(ActiveJobs, !TurretDone)},
                        "To nest: " & CountRows(Filter(open, !Nested)) &
                        "      Nested: " & CountRows(Filter(open, Nested))
                    )
                  Width: =300
                  Wrap: =false
            - tglNesNotNested:
                Control: Classic/Toggle@2.1.0
                Properties:
                  Default: =true
                  FalseFill: =clrGrey
                  FalseHoverFill: =clrGrey
                  FillPortions: =0
                  FocusedBorderThickness: =0
                  HandleFill: =clrText
                  Height: =36
                  LayoutMinWidth: =64
                  ShowLabel: =false
                  TrueFill: =clrGreen
                  TrueHoverFill: =clrGreen
                  Width: =64
            - lblNesNotNested:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  FillPortions: =0
                  Height: =44
                  LayoutMinWidth: =150
                  PaddingLeft: =0
                  Size: =14
                  Text: ="Not nested only"
                  Width: =150
                  Wrap: =false
            - btnNesRefresh:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =clrWhite
                  DisabledColor: =Self.Color
                  DisabledFill: =ColorFade(Self.Fill, -30%)
                  Fill: =clrBlue
                  FillPortions: =0
                  FocusedBorderThickness: =0
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  HoverColor: =Self.Color
                  HoverFill: =ColorFade(Self.Fill, -15%)
                  LayoutMinWidth: =110
                  OnSelect: |-
                    =Refresh(TheWhiteBoard);
                    Set(gblRefreshTick, gblRefreshTick + 1)
                  PressedColor: =Self.Color
                  PressedFill: =ColorFade(Self.Fill, -30%)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =15
                  Text: ="Refresh"
                  Width: =110
            - btnNesHome:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =clrWhite
                  Fill: =clrGrey
                  FillPortions: =0
                  FocusedBorderThickness: =0
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  HoverColor: =Self.Color
                  HoverFill: =ColorFade(Self.Fill, -15%)
                  LayoutMinWidth: =100
                  OnSelect: =Navigate(scrHome, ScreenTransition.None)
                  PressedColor: =Self.Color
                  PressedFill: =ColorFade(Self.Fill, -30%)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =15
                  Text: ="Home"
                  Width: =100
      - lblNesColJob:
          Control: Label@2.5.1
          Properties:
            Color: =clrMuted
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingLeft: =0
            Size: =12
            Text: ="Job / customer"
            Width: =190
            Wrap: =false
            X: =24
            Y: =66
      - lblNesColWhere:
          Control: Label@2.5.1
          Properties:
            Color: =clrMuted
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingLeft: =0
            Size: =12
            Text: ="Machine / day"
            Width: =136
            Wrap: =false
            X: =226
            Y: =66
      - lblNesColSize:
          Control: Label@2.5.1
          Properties:
            Color: =clrMuted
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingLeft: =0
            Size: =12
            Text: ="Size / ship"
            Width: =124
            Wrap: =false
            X: =364
            Y: =66
      - lblNesColGauges:
          Control: Label@2.5.1
          Properties:
            Color: =clrMuted
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingLeft: =0
            Size: =12
            Text: |-
              ="Gauges: tap to select"
            Width: =296
            Wrap: =false
            X: =492
            Y: =66
      - lblNesColLabel:
          Control: Label@2.5.1
          Properties:
            Color: =clrMuted
            FontWeight: =FontWeight.Semibold
            Height: =24
            PaddingLeft: =0
            Size: =12
            Text: ="Nest label"
            Width: =300
            Wrap: =false
            X: =802
            Y: =66
      - galNesJobs:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderThickness: =0
            DelayItemLoading: =false
            Fill: =clrNone
            Height: =668
            Items: |-
              =SortByColumns(
                  Filter(ActiveJobs, !TurretDone && (!tglNesNotNested.Value || !Nested)),
                  "MachineOrder", SortOrder.Ascending,
                  "PunchDayKey", SortOrder.Ascending,
                  "PunchGroupOrder", SortOrder.Ascending,
                  "PairKey", SortOrder.Ascending,
                  "PunchSort", SortOrder.Ascending,
                  "ID", SortOrder.Ascending
              )
            LoadingSpinner: =LoadingSpinner.None
            ShowScrollbar: =true
            TemplatePadding: =0
            TemplateSize: =76
            Width: =1350
            X: =8
            Y: =92
          Children:
            - conNesCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =clrBorder
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =clrCard
                  Height: =Parent.TemplateHeight - 8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.TemplateWidth - 12
                  X: =0
                  Y: =4
                Children:
                  - lblNesJob:
                      Control: Label@2.5.1
                      Properties:
                        Color: =clrText
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        PaddingLeft: =0
                        Size: =17
                        Text: =ThisItem.JobLabel
                        Width: =160
                        Wrap: =false
                        X: =16
                        Y: =6
                  - lblNesCust:
                      Control: Label@2.5.1
                      Properties:
                        Color: =clrMuted
                        Height: =24
                        PaddingLeft: =0
                        Size: =12
                        Text: =ThisItem.CustShort
                        Width: =160
                        Wrap: =false
                        X: =16
                        Y: =36
                  - btnNesPair:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =clrPage
                        Fill: =ThisItem.PairColor
                        FocusedBorderThickness: =0
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        PaddingLeft: =0
                        PaddingRight: =0
                        PressedColor: =Self.Color
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Size: =12
                        Text: =Text(ThisItem.PairRank)
                        Tooltip: ="Paired job, same number and colour as its mate"
                        Visible: =!IsBlank(ThisItem.PairNo)
                        Width: =28
                        X: =180
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblNesMachine:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(ThisItem.MachineText = "SB15", clrSB15, ThisItem.MachineText = "SB8", clrSB8, clrMuted)
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        PaddingLeft: =0
                        Size: =15
                        Text: =If(ThisItem.MachineText = "", "No machine", ThisItem.MachineText)
                        Width: =130
                        Wrap: =false
                        X: =218
                        Y: =6
                  - lblNesDay:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(
                              ThisItem.PunchDayKey = 0, clrMuted,
                              ThisItem.PunchDayKey < TodayKey, clrAmber,
                              ThisItem.PunchDayKey = TodayKey, clrText,
                              clrMuted
                          )
                        FontWeight: =If(ThisItem.PunchDayKey = TodayKey, FontWeight.Semibold, FontWeight.Normal)
                        Height: =24
                        PaddingLeft: =0
                        Size: =12
                        Text: |-
                          =If(
                              ThisItem.PunchDayKey = 0, "Unscheduled",
                              ThisItem.PunchDayKey = TodayKey, "Today " & Text(ThisItem.PunchDay, "mmm d", "en-US"),
                              Text(ThisItem.PunchDay, "ddd mmm d", "en-US")
                          )
                        Width: =130
                        Wrap: =false
                        X: =218
                        Y: =36
                  - lblNesSize:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(IsBlank(ThisItem.JobSize), clrRed, clrText)
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        PaddingLeft: =0
                        Size: =15
                        Text: =ThisItem.SizeText
                        Width: =120
                        Wrap: =false
                        X: =356
                        Y: =6
                  - lblNesShip:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(IsBlank(ThisItem.ShipDate), clrRed, clrMuted)
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =12
                        Text: |-
                          =If(IsBlank(ThisItem.ShipDate), "NO SHIP DATE", "📅 " & ThisItem.ShipText)
                        Width: =126
                        Wrap: =false
                        X: =356
                        Y: =36
                  - btnNesG12:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ThisItem.Need12, clrPage, clrText)
                        DisabledColor: =Self.Color
                        DisabledFill: =ColorFade(Self.Fill, -30%)
                        Fill: =If(ThisItem.Need12 && ThisItem.Done12, clrGreen, ThisItem.Need12, clrYellow, clrGrey)
                        FocusedBorderThickness: =0
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        HoverColor: =Self.Color
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        OnSelect: |-
                          =With({id: ThisItem.ID, v: !ThisItem.Need12},
                              If(
                                  ThisItem.Need12 && (ThisItem.Done12 || LookUp(TheWhiteBoard, ID = id).Done12),
                                  Notify("12 ga is already punched, so it stays selected", NotificationType.Warning);
                                  If(!ThisItem.Done12, Refresh(TheWhiteBoard); Set(gblRefreshTick, gblRefreshTick + 1)),
                                  IfError(
                                      Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {Need12: v}),
                                      Refresh(TheWhiteBoard);
                                      IfError(
                                          Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {Need12: v}),
                                          Notify("Save failed: " & FirstError.Message, NotificationType.Error, 0),
                                          true
                                      ),
                                      true
                                  )
                              )
                          )
                        PaddingLeft: =0
                        PaddingRight: =0
                        PressedColor: =Self.Color
                        PressedFill: =ColorFade(Self.Fill, -25%)
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =14
                        Text: ="12"
                        Width: =44
                        X: =484
                        Y: =(Parent.Height - Self.Height) / 2
