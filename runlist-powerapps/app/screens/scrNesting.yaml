                  - txtNesLabel:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =clrBorder
                        BorderThickness: =1
                        Color: =clrText
                        Default: =ThisItem.NestLabel & ""
                        DisabledColor: =clrMuted
                        DisabledFill: =clrCard
                        Fill: =clrPage
                        FocusedBorderColor: =clrBlue
                        FocusedBorderThickness: =2
                        Height: =44
                        HintText: ="+ add label"
                        HoverColor: =clrText
                        HoverFill: =clrPage
                        MaxLength: =255
                        OnChange: |-
                          =With({id: ThisItem.ID, v: Trim(Self.Text), was: Trim(ThisItem.NestLabel & "")},
                          With({k: id & "|" & was & "|" & v},
                              If(v <> was && locNesSaveKey <> k,
                                  UpdateContext({locNesSaveKey: k, locNesHold: 0});
                                  IfError(
                                      Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {NestLabel: v}),
                                      Refresh(TheWhiteBoard);
                                      IfError(
                                          Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {NestLabel: v}),
                                          Notify("Nest label not saved: " & FirstError.Message, NotificationType.Error, 0);
                                          UpdateContext({locNesSaveKey: ""}),
                                          true
                                      ),
                                      true
                                  )
                              )
                          ))
                        OnSelect: |-
                          =UpdateContext({locNesHold: 2, locNesSaveKey: ""})
                        PressedColor: =clrText
                        PressedFill: =clrPage
                        Size: =15
                        Tooltip: ="Type the nest label, then tap Save (or tap anywhere else)"
                        Width: =Parent.Width - 1050
                        X: =794
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnNesSave:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =clrWhite
                        DisabledColor: =Self.Color
                        DisabledFill: =ColorFade(Self.Fill, -30%)
                        Fill: =clrBlue
                        FocusedBorderThickness: =0
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        HoverColor: =Self.Color
                        HoverFill: =ColorFade(Self.Fill, -15%)
                        OnSelect: |-
                          =With({id: ThisItem.ID, v: Trim(txtNesLabel.Text), was: Trim(ThisItem.NestLabel & "")},
                          With({k: id & "|" & was & "|" & v},
                              If(v <> was && locNesSaveKey <> k,
                                  UpdateContext({locNesSaveKey: k, locNesHold: 0});
                                  IfError(
                                      Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {NestLabel: v}),
                                      Refresh(TheWhiteBoard);
                                      IfError(
                                          Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {NestLabel: v}),
                                          Notify("Nest label not saved: " & FirstError.Message, NotificationType.Error, 0);
                                          UpdateContext({locNesSaveKey: ""}),
                                          true
                                      ),
                                      true
                                  )
                              )
                          ))
                        PaddingLeft: =0
                        PaddingRight: =0
                        PressedColor: =Self.Color
                        PressedFill: =ColorFade(Self.Fill, -30%)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =15
                        Text: ="Save"
                        Tooltip: ="Save the nest label"
                        Visible: =Trim(txtNesLabel.Text) <> Trim(ThisItem.NestLabel & "")
                        Width: =76
                        X: =Parent.Width - 248
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnNesNested:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ThisItem.Nested, clrPage, clrText)
                        DisabledColor: =Self.Color
                        DisabledFill: =ColorFade(Self.Fill, -30%)
                        Fill: =If(ThisItem.Nested, clrGreen, clrGrey)
                        FocusedBorderThickness: =0
                        FontWeight: =FontWeight.Bold
                        Height: =56
                        HoverColor: =Self.Color
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        OnSelect: |-
                          =With({id: ThisItem.ID, v: !ThisItem.Nested, lbl: ThisItem.JobLabel, nc: ThisItem.NeedCount},
                              IfError(
                                  Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {Nested: v}),
                                  Refresh(TheWhiteBoard);
                                  IfError(
                                      Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), {Nested: v}),
                                      Notify("Save failed: " & FirstError.Message, NotificationType.Error, 0),
                                      If(v, Notify(lbl & " marked Nested" & If(nc = 0, ", but it has no gauges selected yet. Switch off Not nested only to see it and pick its gauges.", "."), If(nc = 0, NotificationType.Warning, NotificationType.Success), If(nc = 0, 8000, 3000)))
                                  ),
                                  If(v, Notify(lbl & " marked Nested" & If(nc = 0, ", but it has no gauges selected yet. Switch off Not nested only to see it and pick its gauges.", "."), If(nc = 0, NotificationType.Warning, NotificationType.Success), If(nc = 0, 8000, 3000)))
                              )
                          )
                        PressedColor: =Self.Color
                        PressedFill: =ColorFade(Self.Fill, -25%)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =18
                        Text: |-
                          =If(ThisItem.Nested, "✓ Nested", "Nested")
                        Tooltip: ="Tap to mark this job nested (tap again to undo)"
                        Width: =150
                        X: =Parent.Width - Self.Width - 12
                        Y: =(Parent.Height - Self.Height) / 2
      - lblNesEmpty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =clrMuted
            Height: =60
            Size: =18
            Text: |-
              =If(IsEmpty(Filter(ActiveJobs, !TurretDone)), "No open jobs.", "Nothing to nest: every open job is marked Nested.")
            Visible: =IsEmpty(Filter(ActiveJobs, !TurretDone && (!tglNesNotNested.Value || !Nested)))
            Width: =1366
            X: =0
            Y: =200
      - tmrNesRefresh:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =true
            AutoStart: =true
            Duration: =30000
            OnTimerEnd: |-
              =If(locNesHold > 0,
                  UpdateContext({locNesHold: locNesHold - 1}),
                  Refresh(TheWhiteBoard);
                  Set(gblRefreshTick, gblRefreshTick + 1)
              )
            Repeat: =true
            Visible: =false
