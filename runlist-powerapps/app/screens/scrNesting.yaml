                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =14
                        Text: ="14"
                        Width: =44
                        X: =484 + 1 * 50
                        Y: =(Parent.Height - Self.Height) / 2
