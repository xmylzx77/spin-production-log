                        DisabledColor: =Self.Color
                        DisabledFill: =ColorFade(Self.Fill, -30%)
                        Fill: =If(ThisItem.Need24 && ThisItem.Done24, clrGreen, ThisItem.Need24, clrYellow, clrGrey)
