                  Size: =12
                  Text: |-
                    =locImpRanCount & " jobs in the copy (copied " &
                    If(IsBlank(locImpRanPulled), "at an unknown time", Text(locImpRanPulled, "ddd h:mm AM/PM", "en-US")) &
                    ", " & locImpRanDays & "-day look-ahead). New cards are added for ship dates up to " &
                    Text(locImpRanHz, "ddd mmm d", "en-US") & "." &
                    With({nd: CountRows(Filter(colImpResult, Kind = "had" && Sub = "Done"))}, If(nd > 0, " Already had includes " & nd & " done job(s).", "")) &
                    With({nid: CountRows(Filter(colImpResult, IdNew))}, If(nid > 0, " CASMFG ids refreshed: " & nid & ".", "")) &
                    locImpRanNote
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =locImpRan && !locImpRunning
                  Width: =734
                  X: =20
                  Y: =44
            - galImpTiles:
