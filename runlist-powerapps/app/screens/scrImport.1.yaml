                        {T: "Ship moves", N: CountRows(Filter(colImpResult, Moved)), C: clrAmber, S: "ship dates changed"},
                        {T: "Already had", N: CountRows(Filter(colImpResult, Kind = "had")), C: clrText, S: "on the board or done"},
                        {T: "Blocked", N: CountRows(Filter(colImpResult, Kind = "blocked")), C: clrSB15, S: "dismissed, see the list"},
                        {T: "Failed", N: CountRows(Filter(colImpResult, Kind = "failed")), C: clrRed, S: "not saved, see the list"},
                        {T: "Watch only", N: CountRows(Filter(colImpResult, Kind = "watch")), C: clrSB8, S: "ship more than 16 days out"}
