Screens:
  scrImport:
    Properties:
      Fill: =clrPage
      OnVisible: |-
        =Refresh(TheWhiteBoard);
        Set(gblRefreshTick, gblRefreshTick + 1);
        // locImpRunning is NOT reset here: only the end of a run clears it (blank on the first visit reads as false)
        UpdateContext({locImpAsk: false, locImpMsg: "", locImpNarrow: false});
        Reset(txtImpPaste)
    Children:
      - conImpHeader:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =clrCard
            Height: =64
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.Start
            PaddingLeft: =16
            PaddingRight: =16
            Width: =1366
            X: =0
            Y: =0
          Children:
            - lblImpTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  FillPortions: =1
                  FontWeight: =FontWeight.Bold
                  Height: =44
                  LayoutMinWidth: =160
                  PaddingLeft: =0
                  Size: =22
                  Text: ="Import from CASMFG"
                  Wrap: =false
            - btnImpPunch:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =clrWhite
                  DisabledColor: =clrMuted
                  DisabledFill: =ColorFade(Self.Fill, -40%)
                  DisplayMode: =If(locImpRunning, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrBlue
                  FillPortions: =0
                  FocusedBorderThickness: =0
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  HoverColor: =Self.Color
                  HoverFill: =ColorFade(Self.Fill, -15%)
                  LayoutMinWidth: =150
                  OnSelect: =Navigate(scrPunch, ScreenTransition.None)
                  PressedColor: =Self.Color
                  PressedFill: =ColorFade(Self.Fill, -30%)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =15
                  Text: ="Go to Punch"
                  Width: =150
            - btnImpHome:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =clrWhite
                  DisabledColor: =clrMuted
                  DisabledFill: =ColorFade(Self.Fill, -40%)
                  DisplayMode: =If(locImpRunning, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =clrGrey
                  FillPortions: =0
                  FocusedBorderThickness: =0
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  HoverColor: =Self.Color
                  HoverFill: =ColorFade(Self.Fill, -15%)
                  LayoutMinWidth: =100
                  OnSelect: =Navigate(scrHome, ScreenTransition.None)
                  PressedColor: =Self.Color
                  PressedFill: =ColorFade(Self.Fill, -30%)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =15
                  Text: ="Home"
                  Width: =100
      - lblImpHelp:
          Control: Label@2.5.1
          Properties:
            Color: =clrText
            FontWeight: =FontWeight.Semibold
            Height: =40
            PaddingLeft: =0
            Size: =13
            Text: ="In CASMFG, click the clipboard icon in the top bar, then paste here."
            Width: =532
            Wrap: =false
            X: =24
            Y: =76
      - txtImpPaste:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =clrBorder
            BorderThickness: =1
            Color: =clrText
            Default: =""
            DisabledColor: =clrMuted
            DisabledFill: =clrCard
            EnableSpellCheck: =false
            Fill: =clrCard
            FocusedBorderColor: =clrBlue
            FocusedBorderThickness: =2
            Height: =320
            HintText: ="Paste the copied jobs here (click here, then Ctrl+V)"
            HoverColor: =clrText
            HoverFill: =clrCard
            MaxLength: =2000000
            Mode: =TextMode.MultiLine
            PressedColor: =clrText
            PressedFill: =clrCard
            Size: =11
            Width: =532
            X: =24
            Y: =120
      - btnImpImport:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: |-
              =If(locImpAsk && locImpAskLen = Len(txtImpPaste.Text), clrPage, clrWhite)
            DisabledColor: =clrMuted
            DisabledFill: =ColorFade(clrBlue, -55%)
            DisplayMode: |-
              =If(locImpRunning || locImpPlacing || Len(Trim(txtImpPaste.Text)) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: |-
              =If(locImpAsk && locImpAskLen = Len(txtImpPaste.Text), clrAmber, clrBlue)
            FocusedBorderThickness: =0
            FontWeight: =FontWeight.Bold
            Height: =56
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =UpdateContext({locImpMsg: "", locImpNarrow: false, locImpReady: false});
              // ---- 1. Read the paste (import contract v1, list-design) ----
              With({j: IfError(ParseJSON(txtImpPaste.Text), Blank())},
                  If(
                      IsBlank(j),
                          UpdateContext({locImpMsg: "This isn't a White Board copy (it isn't valid JSON). In CASMFG, click the clipboard icon in the top bar, then paste here again."}),
                      IfError(Value(j.v), -1) <> 1,
                          UpdateContext({locImpMsg: "This copy has the wrong format (it isn't version 1). Update the CASMFG copy script, then copy again."}),
                      IfError(
                          ClearCollect(colImpRaw,
                              ForAll(Table(j.jobs) As r,
                                  With({
                                          num: Trim(IfError(Text(r.Value.number), Text(Value(r.Value.number)))) & "",
                                          unit: Trim(IfError(Text(r.Value.unit), Text(Value(r.Value.unit)))) & "",
                                          sh: Trim(Text(r.Value.shipDate)) & "",
                                          model: Trim(Text(r.Value.model)) & ""
                                      },
                                  With({ok: IsMatch(sh, "\d{4}-\d{2}-\d{2}", MatchOptions.BeginsWith)},
                                  With({sd: If(ok, Date(Value(Left(sh, 4)), Value(Mid(sh, 6, 2)), Value(Mid(sh, 9, 2))), Blank())},
                                  With({m: Match(Upper(model), "CASRTU\s*(?<sz>\d+)")},
                                      {
                                          Key: Upper(Trim(num)) & "|" & Upper(Trim(unit)),
                                          Num: num,
                                          Unit: unit,
                                          Label: num & If(unit <> "", "-" & unit, ""),
                                          Name: Trim(Text(r.Value.name)) & "",
                                          Model: model,
                                          CasId: Trim(IfError(Text(r.Value.id), Text(Value(r.Value.id)))) & "",
                                          Ship: If(ok, Left(sh, 10), ""),
                                          ShipOk: ok,
                                          ShipDate: sd,
                                          ShipKey: If(ok, Value(Left(sh, 4)) * 10000 + Value(Mid(sh, 6, 2)) * 100 + Value(Mid(sh, 9, 2)), 99999999),
                                          ShipShow: If(ok, Text(sd, "m/d"), "NO SHIP DATE"),
                                          Size: If(!IsBlank(m) && Value(m.sz) >= 1 && Value(m.sz) <= 4, Value(m.sz), Blank())
                                      }
                                  ))))
                              )
                          ),
                          UpdateContext({locImpMsg: "The job list in this copy couldn't be read (" & FirstError.Message & "). Copy again in CASMFG."}),
                          UpdateContext({
                              locImpReady: true,
                              locImpDays: IfError(Value(j.days), 0),
                              locImpPulledTxt: IfError(Text(j.pulledAt), "") & "",
                              locImpPulled: IfError(DateTimeValue(j.pulledAt), Blank())
                          })
                      )
                  )
              );
              // ---- 2. Checks before running ----
              If(locImpReady,
                  // one row per job key (a repeated key in the copy counts once)
                  ClearCollect(colImpPaste, ForAll(Distinct(Filter(colImpRaw, Num <> ""), Key) As d, LookUp(colImpRaw, Key = d.Value)));
                  UpdateContext({
                      locImpNarrow: locImpDays < 90,
                      locImpAge: If(IsBlank(locImpPulled), 0, DateDiff(locImpPulled, Now(), TimeUnit.Minutes))
                  });
                  If(
                      CountRows(colImpPaste) = 0,
                          UpdateContext({locImpMsg: "This copy holds no jobs. In CASMFG, check that the In-Process CASRTU jobs are listed, then copy again."}),
                      (IsBlank(locImpPulled) || locImpAge > 120) && !(locImpAsk && locImpAskFor = locImpPulledTxt && locImpAskLen = Len(txtImpPaste.Text) && DateDiff(locImpAskAt, Now(), TimeUnit.Milliseconds) >= 1000),
                          // older than 2 hours (or no copy time): ask first; a second tap on this button confirms.
                          // A second tap within 1 second of the question (a fast double tap) only asks again.
                          UpdateContext({locImpAsk: true, locImpAskFor: locImpPulledTxt, locImpAskLen: Len(txtImpPaste.Text), locImpAskAt: Now()}),
                      // ---- 3. IMPORT RUN (list-design, status model) ----
                      UpdateContext({locImpRunning: true, locImpAsk: false});
                      Refresh(TheWhiteBoard);
                      Set(gblRefreshTick, gblRefreshTick + 1);
                      Clear(colImpResult);
                      With({
                              act: ShowColumns(ActiveJobs, ID, Title, ShipYmd, CasmfgId, Started),
                              inc: ShowColumns(IncomingJobs, ID, Title, ShipYmd, CasmfgId, Started),
                              hz: With({h: DateAdd(Today(), 16, TimeUnit.Days)}, Year(h) * 10000 + Month(h) * 100 + Day(h))
                          },
                          ForAll(colImpPaste As p,
                              With({oa: LookUp(act, Title = p.Key)},
                              With({o: If(IsBlank(oa), LookUp(inc, Title = p.Key), oa)},
                              If(
                                  // the board copy couldn't be read (network, SharePoint busy): list it as failed, never drop it
                                  IsError(o),
                                      Collect(colImpResult, Patch(p, {Kind: "failed", Sub: "update", Moved: false, OldShow: "", IdNew: false, Msg: p.Label & ": couldn't read the board (" & IfError(Text(o.ID), FirstError.Message) & ")", RowID: 0, Modified: Blank(), Restored: false})),
                                  // (a) open job, and its board copy already matches CASMFG: nothing to write
                                  !IsBlank(o) && !(p.ShipOk && o.ShipYmd <> p.Ship) && !(p.CasId <> "" && o.CasmfgId & "" <> p.CasId),
                                      Collect(colImpResult, Patch(p, {Kind: "had", Sub: If(IsBlank(oa), "Incoming", "Active"), Moved: false, OldShow: "", IdNew: false, Msg: "", RowID: o.ID, Modified: Blank(), Restored: false})),
                                  // (a) open job that may need a ship move or a CasmfgId refresh: decide from a fresh row
                                  !IsBlank(o),
                                      With({oid: o.ID}, With({row: LookUp(TheWhiteBoard, ID = oid)},
                                      If(IsError(row),
                                          // the fresh read failed: list it as failed (Tap Import again), never drop it
                                          Collect(colImpResult, Patch(p, {Kind: "failed", Sub: "update", Moved: false, OldShow: "", IdNew: false, Msg: p.Label & ": couldn't read this job from the list (" & IfError(Text(row.ID), FirstError.Message) & ")", RowID: o.ID, Modified: Blank(), Restored: false})),
                                      With({
                                              st: row.JobStatus.Value & "",
                                              oldYmd: If(IsBlank(row.ShipDate), "", Text(row.ShipDate, "yyyy-mm-dd")),
                                              prevYmd: If(IsBlank(row.PrevShipDate), "", Text(row.PrevShipDate, "yyyy-mm-dd"))
                                          },
                                      With({
                                              mv: If(IsBlank(row) || !p.ShipOk || oldYmd = p.Ship, "", st = "Incoming", "inc", st = "Active" && !row.Started, "act", ""),
                                              idNew: !IsBlank(row) && (st = "Incoming" || st = "Active") && p.CasId <> "" && row.CasmfgId & "" <> p.CasId,
                                              np: If(p.Ship = prevYmd, Blank(), Coalesce(row.PrevShipDate, row.ShipDate))
                                          },
                                      With({
                                              e1: Switch(mv,
                                                  "inc",
                                                      IfError(
                                                          Text(Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = oid), {ShipDate: p.ShipDate}).ID),
                                                          Refresh(TheWhiteBoard);
                                                          IfError(Text(Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = oid), {ShipDate: p.ShipDate}).ID), "!" & FirstError.Message, ""),
                                                          ""
                                                      ),
                                                  "act",
                                                      IfError(
                                                          Text(Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = oid), {PrevShipDate: np, ShipDate: p.ShipDate}).ID),
                                                          Refresh(TheWhiteBoard);
                                                          IfError(Text(Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = oid), {PrevShipDate: np, ShipDate: p.ShipDate}).ID), "!" & FirstError.Message, ""),
                                                          ""
                                                      ),
                                                  ""
                                              )
                                          },
                                      With({
                                              e2: If(idNew,
                                                  IfError(
                                                      Text(Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = oid), {CasmfgId: p.CasId}).ID),
                                                      Refresh(TheWhiteBoard);
                                                      IfError(Text(Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = oid), {CasmfgId: p.CasId}).ID), "!" & FirstError.Message, ""),
                                                      ""
                                                  ),
                                                  ""
                                              )
                                          },
                                          Collect(colImpResult, Patch(p, {
                                              Kind: If(e1 = "" && e2 = "", "had", "failed"),
                                              // "update" only when the ship move itself failed (a saved move keeps its status for the moved list)
                                              Sub: If(e1 = "", st, "update"),
                                              Moved: mv <> "" && e1 = "",
                                              OldShow: If(oldYmd = "", "none", Text(row.ShipDate, "m/d")),
                                              IdNew: idNew && e2 = "",
                                              // saved: what the move did to the Punch flag (PrevShipDate); failed: the reason
                                              Msg: If(e1 = "" && e2 = "",
                                                  If(mv = "act", If(IsBlank(np), If(IsBlank(row.PrevShipDate), "", "flag cleared"), "flagged on the Punch board"), ""),
                                                  p.Label & ": " & If(e1 <> "", "ship date not saved (" & Mid(e1, 2) & ") ", "") & If(e2 <> "", "CASMFG id not saved (" & Mid(e2, 2) & ")", "")
                                              ),
                                              RowID: o.ID,
                                              Modified: Blank(),
                                              Restored: false
                                          }))
                                      ))))))),
                                  // (c) not open, ships more than 16 days out: watch only, no server call
                                  p.ShipOk && p.ShipKey > hz,
                                      Collect(colImpResult, Patch(p, {Kind: "watch", Sub: "", Moved: false, OldShow: "", IdNew: false, Msg: "", RowID: 0, Modified: Blank(), Restored: false})),
                                  // (b) not open, ships within 16 days (or no valid ship date): look the key up in any status
                                  With({f: LookUp(TheWhiteBoard, Title = p.Key)},
                                      If(
                                          // the key check failed (network, SharePoint busy): list it as failed with Retry, never drop it
                                          IsError(f),
                                              Collect(colImpResult, Patch(p, {Kind: "failed", Sub: "create", Moved: false, OldShow: "", IdNew: false, Msg: p.Label & ": couldn't check the list (" & IfError(Text(f.ID), FirstError.Message) & ")", RowID: 0, Modified: Blank(), Restored: false})),
                                          !IsBlank(f),
                                              Collect(colImpResult, Patch(p, {Kind: If(f.JobStatus.Value = "Dismissed", "blocked", "had"), Sub: f.JobStatus.Value & "", Moved: false, OldShow: "", IdNew: false, Msg: "", RowID: f.ID, Modified: f.Modified, Restored: false})),
                                          // not found: create an Incoming job with every value explicit
                                          With({e: IfError(
                                                  Text(Patch(TheWhiteBoard, Defaults(TheWhiteBoard), {
                                                      Title: p.Key,
                                                      JobNumber: p.Num,
                                                      UnitNumber: p.Unit,
                                                      FanNumber: p.Unit,
                                                      JobName: p.Name,
                                                      ProductModel: p.Model,
                                                      CasmfgId: p.CasId,
                                                      JobSize: p.Size,
                                                      ShipDate: p.ShipDate,
                                                      JobStatus: {Value: "Incoming"},
                                                      Nested: false,
                                                      Need12: false, Need14: false, Need16: false, Need18: false, Need20: false, Need24: false,
                                                      Done12: false, Done14: false, Done16: false, Done18: false, Done20: false, Done24: false,
                                                      PBDone: false, P4Done: false, Started: false
                                                  }).ID),
                                                  "!" & FirstError.Message,
                                                  ""
                                              )},
                                              If(e = "",
                                                  Collect(colImpResult, Patch(p, {Kind: "added", Sub: "Incoming", Moved: false, OldShow: "", IdNew: false, Msg: "", RowID: 0, Modified: Blank(), Restored: false})),
                                                  // the create failed: re-check before calling it a failure (another import may have made it).
                                                  // A failed re-check counts as not found, so the job lands in Failed with Retry.
                                                  With({again: IfError(LookUp(TheWhiteBoard, Title = p.Key), Blank())},
                                                      Collect(colImpResult, Patch(p, {
                                                          Kind: If(IsBlank(again), "failed", "had"),
                                                          Sub: If(IsBlank(again), "create", again.JobStatus.Value & ""),
                                                          Moved: false,
                                                          OldShow: "",
                                                          IdNew: false,
                                                          Msg: If(IsBlank(again), p.Key & ": " & Mid(e, 2), ""),
                                                          RowID: If(IsBlank(again), 0, again.ID),
                                                          Modified: Blank(),
                                                          Restored: false
                                                      }))
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )))
                          )
                      );
                      // ---- 4. Summary ----
                      UpdateContext({
                          locImpRunning: false,
                          locImpRan: true,
                          locImpRanAt: Now(),
                          locImpRanCount: CountRows(colImpPaste),
                          locImpRanDays: locImpDays,
                          locImpRanPulled: locImpPulled,
                          locImpRanHz: DateAdd(Today(), 16, TimeUnit.Days),
                          locImpRanNote: With({
                                  dup: CountRows(Filter(colImpRaw, Num <> "")) - CountRows(colImpPaste),
                                  skip: CountRows(Filter(colImpRaw, Num = ""))
                              },
                              If(dup > 0, " " & dup & " job(s) were listed twice in the copy and counted once.", "") &
                              If(skip > 0, " " & skip & " row(s) without a job number were ignored.", "")
                          )
                      });
                      // ---- 5. Auto-place: btnImpPlace puts the tray jobs on the Punch and Assembly boards
                      // and shows this summary in front of its own message (Select runs it after this formula)
                      With({
                              na: CountRows(Filter(colImpResult, Kind = "added")),
                              nm: CountRows(Filter(colImpResult, Moved)),
                              nf: CountRows(Filter(colImpResult, Kind = "failed"))
                          },
                          UpdateContext({locImpPre: "Import done: " & na & " added, " & nm & " ship move(s)" & If(nf > 0, ", " & nf & " failed (see the red list)", "") & ". "})
                      );
                      Select(btnImpPlace)
                  )
              );
              // a red message replaces any old "copy is old" question
              If(!IsBlank(locImpMsg), UpdateContext({locImpAsk: false}))
            PressedColor: =Self.Color
            PressedFill: =ColorFade(Self.Fill, -30%)
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Size: =18
            Text: |-
              =If(locImpRunning, "Importing...", locImpAsk && locImpAskLen = Len(txtImpPaste.Text), "Import anyway", "Import")
            Width: =300
            X: =24
            Y: =452
      - btnImpClear:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =clrWhite
            DisabledColor: =clrMuted
            DisabledFill: =ColorFade(clrGrey, -40%)
            DisplayMode: =If(locImpRunning, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =clrGrey
            FocusedBorderThickness: =0
            FontWeight: =FontWeight.Semibold
            Height: =56
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =Reset(txtImpPaste);
              UpdateContext({locImpAsk: false, locImpMsg: "", locImpNarrow: false})
            PressedColor: =Self.Color
            PressedFill: =ColorFade(Self.Fill, -30%)
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Size: =16
            Text: ="Clear"
            Width: =140
            X: =336
            Y: =452
      - lblImpError:
          Control: Label@2.5.1
          Properties:
            BorderColor: =clrRed
            BorderThickness: =2
            Color: =clrRed
            Fill: =clrCard
            FontWeight: =FontWeight.Semibold
            Height: =110
            PaddingBottom: =10
            PaddingLeft: =14
            PaddingRight: =14
            PaddingTop: =10
            Size: =15
            Text: =locImpMsg
            VerticalAlign: =VerticalAlign.Top
            Visible: =!IsBlank(locImpMsg)
            Width: =532
            X: =24
            Y: =520
      - lblImpNarrow:
          Control: Label@2.5.1
          Properties:
            Color: =clrWhite
            Fill: =clrRed
            FontWeight: =FontWeight.Bold
            Height: =76
            PaddingBottom: =4
            PaddingLeft: =14
            PaddingRight: =14
            PaddingTop: =4
            Size: =14
            Text: |-
              ="Narrow pull: ship dates moved more than 16 days out can't be seen. Copy again." & Char(10) & "(This copy looks ahead " & locImpDays & " days, not 180.)"
            VerticalAlign: =VerticalAlign.Middle
            Visible: =locImpNarrow && IsBlank(locImpMsg)
            Width: =532
            X: =24
            Y: =520
      - lblImpRunning:
          Control: Label@2.5.1
          Properties:
            BorderColor: =clrBlue
            BorderThickness: =2
            Color: =clrText
            Fill: =clrCard
            FontWeight: =FontWeight.Semibold
            Height: =76
            PaddingLeft: =14
            PaddingRight: =14
            Size: =15
            Text: |-
              ="Importing " & CountRows(colImpPaste) & " jobs. Please wait and stay on this screen. A big first import can take a minute or two."
            Visible: =locImpRunning
            Width: =532
            X: =24
            Y: =If(locImpNarrow, 606, 520)
      - conImpAsk:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =clrAmber
            BorderThickness: =2
            DropShadow: =DropShadow.None
            Fill: =clrCard
            Height: =156
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: |-
              =locImpAsk && !locImpRunning && locImpAskLen = Len(txtImpPaste.Text)
            Width: =532
            X: =24
            Y: =If(locImpNarrow, 606, 520)
          Children:
            - lblImpAskText:
                Control: Label@2.5.1
                Properties:
                  Color: =clrText
                  Height: =92
                  PaddingLeft: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |-
                    =If(
                        IsBlank(locImpPulled),
                            "This copy has no copy time, so its age is unknown.",
                        "This copy is old: it was made " &
                            With({hrs: RoundDown(locImpAge / 60, 0)},
                                If(hrs >= 48, RoundDown(hrs / 24, 0) & " days", hrs & " h " & Mod(locImpAge, 60) & " min")
                            ) &
                            " ago (" & Text(locImpPulled, "ddd mmm d, h:mm AM/PM", "en-US") & ")."
                    ) & " Ship dates may have changed since. Copy again in CASMFG, or tap Import anyway."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =500
                  X: =16
                  Y: =12
            - btnImpAskCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =clrWhite
                  Fill: =clrGrey
                  FocusedBorderThickness: =0
                  FontWeight: =FontWeight.Semibold
                  Height: =40
                  HoverColor: =Self.Color
                  HoverFill: =ColorFade(Self.Fill, -15%)
                  OnSelect: |-
                    =Reset(txtImpPaste);
                    UpdateContext({locImpAsk: false, locImpMsg: "", locImpNarrow: false})
                  PressedColor: =Self.Color
                  PressedFill: =ColorFade(Self.Fill, -30%)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =14
                  Text: ="Cancel"
                  Width: =140
                  X: =16
                  Y: =104
      - btnImpPlace:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =clrWhite
            DisabledColor: =clrMuted
            DisabledFill: =ColorFade(clrBlue, -55%)
            DisplayMode: =If(locImpRunning || locImpPlacing, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: |-
              =If(CountRows(Filter(IncomingJobs, JobSize >= 1 && JobSize <= 4 && ShipKey < 99999999)) = 0, clrGrey, clrBlue)
            FocusedBorderThickness: =0
            FontWeight: =FontWeight.Semibold
            Height: =48
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, -15%)
            OnSelect: |-
              =UpdateContext({locImpPlacing: true});
              // Basic auto-place (runs by itself after every Import; a tap runs it again).
              // Every tray job with a size and a ship date goes on both boards:
              //   Punch: size 1 and 4 on SB8, size 2 and 3 on SB15. Aim 5 workdays before ship.
              //          A day holds 5 units on SB8, 6 on SB15 (size 1 = 1 unit, 2 and 3 = 2, 4 = 3).
              //   Assembly: size 1 and 2 on Line 1, 3 on Line 2, 4 (and a heavy 3) on Line 3. Aim 3 workdays
              //          before ship, never sooner than 2 workdays after its punch day. A line holds 3 jobs a day
              //          (a size 4 counts 1.5).
              // A full day pushes the job to the next workday (Mon-Fri, today or later). It goes at the end of
              // its day (max order + 1). Gauges are still picked on the Punch card.
              Refresh(TheWhiteBoard);
              Set(gblRefreshTick, gblRefreshTick + 1);
              // open workdays, today or later (about 3 months)
              ClearCollect(colPlDays,
                  ForAll(Filter(ForAll(Sequence(90, 0) As s, {D: DateAdd(Today(), s.Value, TimeUnit.Days)}), Weekday(D, StartOfWeek.Monday) <= 5) As x,
                      {D: x.D, K: Year(x.D) * 10000 + Month(x.D) * 100 + Day(x.D)}
                  )
              );
              // what the boards already hold
              ClearCollect(colPlPunch, ForAll(Filter(ActiveJobs, MachineText <> "" && PunchDayKey > 0) As a, {M: a.MachineText, K: a.PunchDayKey, U: Switch(a.JobSize, 1, 1, 4, 3, 2), O: a.PunchSort}));
              ClearCollect(colPlAsm, ForAll(Filter(ActiveJobs, LineText <> "" && AsmKey < 99999999) As a, {L: a.LineText, K: a.AsmKey, W: If(a.JobSize = 4, 1.5, 1), O: a.AsmSort}));
              // the tray jobs to place, earliest ship first
              ClearCollect(colPlTodo,
                  SortByColumns(
                      ShowColumns(Filter(IncomingJobs, JobSize >= 1 && JobSize <= 4 && ShipKey < 99999999), ID, JobSize, HeavyTon, ShipKey, JobLabel),
                      "ShipKey", SortOrder.Ascending, "ID", SortOrder.Ascending
                  )
              );
              Clear(colPlDone);
              ForAll(colPlTodo As j,
                  With({
                          jid: j.ID,
                          mach: If(j.JobSize = 1 || j.JobSize = 4, "SB8", "SB15"),
                          pu: Switch(j.JobSize, 1, 1, 4, 3, 2),
                          line: If(j.JobSize = 4 || (j.JobSize = 3 && j.HeavyTon), "Line 3", j.JobSize = 3, "Line 2", "Line 1"),
                          aw: If(j.JobSize = 4, 1.5, 1),
                          nb: CountRows(Filter(colPlDays, K < j.ShipKey))
                      },
                  With({
                          cap: If(mach = "SB8", 5, 6),
                          // 5 and 3 workdays before ship (the first open day when that has passed)
                          ptk: Index(colPlDays, Max(1, nb - 4)).K,
                          atk: Index(colPlDays, Max(1, nb - 2)).K
                      },
                  With({pk: Coalesce(First(Filter(colPlDays As dd, dd.K >= ptk && Sum(Filter(colPlPunch, M = mach && K = dd.K), U) + pu <= cap)).K, ptk)},
                  With({ppos: CountRows(Filter(colPlDays, K <= pk))},
                  With({amin: Max(atk, Index(colPlDays, Min(ppos + 2, CountRows(colPlDays))).K)},
                  With({ak: Coalesce(First(Filter(colPlDays As dd, dd.K >= amin && Sum(Filter(colPlAsm, L = line && K = dd.K), W) + aw <= 3)).K, amin)},
                  With({
                          pd: LookUp(colPlDays, K = pk).D,
                          ad: LookUp(colPlDays, K = ak).D,
                          po: Coalesce(Max(Filter(colPlPunch, M = mach && K = pk), O), 0) + 1,
                          ao: Coalesce(Max(Filter(colPlAsm, L = line && K = ak), O), 0) + 1,
                          cur: LookUp(TheWhiteBoard, ID = jid)
                      },
                  With({st: IfError(cur.JobStatus.Value & "", "!")},
                      If(
                          st = "!",
                              Collect(colPlDone, {ID: jid, Ok: false, Msg: j.JobLabel & ": couldn't read it from the list"});
                              false,
                          // placed or dismissed on another device meanwhile: leave it
                          st <> "Incoming",
                              true,
                          IfError(
                              Patch(TheWhiteBoard, cur, {JobStatus: {Value: "Active"}, Machine: {Value: mach}, PunchDay: pd, PunchOrder: po, AssemblyLine: {Value: line}, AssemblyDate: ad, AssemblyOrder: ao}),
                              Collect(colPlDone, {ID: jid, Ok: false, Msg: j.JobLabel & ": " & FirstError.Message});
                              false,
                              Collect(colPlPunch, {M: mach, K: pk, U: pu, O: po});
                              Collect(colPlAsm, {L: line, K: ak, W: aw, O: ao});
                              Collect(colPlDone, {ID: jid, Ok: true, Msg: ""});
                              true
                          )
                      )
                  ))))))))
              );
              Refresh(TheWhiteBoard);
              Set(gblRefreshTick, gblRefreshTick + 1);
              With({
                      ok: CountRows(Filter(colPlDone, Ok)),
                      bad: CountRows(Filter(colPlDone, !Ok)),
                      left: CountRows(Filter(IncomingJobs, !(JobSize >= 1 && JobSize <= 4) || ShipKey = 99999999))
                  },
                  Notify(
                      locImpPre &
                      If(ok = 0 && bad = 0, "Nothing new to place.", "Placed " & ok & " job(s) on the Punch and Assembly boards.") &
                      If(bad > 0, " " & bad & " couldn't be saved: tap Place again.", "") &
                      If(left > 0, " " & left & " stay in the tray (no size or no ship date): place them on the Punch screen.", ""),
                      If(bad > 0 || left > 0 || Find("failed", locImpPre) > 0, NotificationType.Warning, NotificationType.Success)
                  )
              );
              UpdateContext({locImpPlacing: false, locImpPre: ""})
            PressedColor: =Self.Color
            PressedFill: =ColorFade(Self.Fill, -30%)
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Size: =15
            Text: |-
              =If(locImpPlacing, "Placing jobs on the boards...",
                  With({n: CountRows(Filter(IncomingJobs, JobSize >= 1 && JobSize <= 4 && ShipKey < 99999999))},
                      If(n = 0, "Tray: nothing to place", "Place " & n & " tray job(s) on Punch + Assembly")
                  )
              )
            Visible: =!conImpAsk.Visible
            Width: =532
            X: =24
            Y: =708
