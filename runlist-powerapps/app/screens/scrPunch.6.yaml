      PaddingTop: =0
      Size: =12
      Text: |-
        ="⚠ SB15"
      Tooltip: ="Size " & ThisItem.JobSize & " normally punches on SB8"
      Visible: =ThisItem.MachineText = "SB15" && (ThisItem.JobSize = 1 || ThisItem.JobSize = 4)
