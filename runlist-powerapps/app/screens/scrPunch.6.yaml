        With({cur: LookUp(RunListJobs, ID = id)},
            // An import can move the ship date again and keep the first PrevShipDate.
            // Only clear the flag for the ship date this card is showing (as scrAssembly).
            If(
                If(IsBlank(cur.ShipDate), "", Text(cur.ShipDate, "yyyy-mm-dd")) <> seen,
                Notify("CASMFG moved this ship date again. Check the new date on the card, then tap the tag again.", NotificationType.Warning);
                Refresh(RunListJobs);
                Set(gblRefreshTick, gblRefreshTick + 1),
                IfError(
                    Patch(RunListJobs, LookUp(RunListJobs, ID = id), {PrevShipDate: Blank()}),
                    Refresh(RunListJobs);
                    IfError(
                        Patch(RunListJobs, LookUp(RunListJobs, ID = id), {PrevShipDate: Blank()}),
                        Notify("Save failed: " & FirstError.Message, NotificationType.Error, 0)
                    )
                )
            )
        ))
      PaddingLeft: =0
      PaddingRight: =0
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =13
      RadiusBottomRight: =13
      RadiusTopLeft: =13
      RadiusTopRight: =13
      Size: =11
      Text: |-
        ="📅 moved from " & ThisItem.PrevShipText
      Tooltip: |-
        ="CASMFG moved the ship date from " & ThisItem.PrevShipText & " to " & ThisItem.ShipText & ". Tap to acknowledge."
      Visible: =ThisItem.PrevShipText <> ""
      Width: =160
      X: =206 + If(ThisItem.IsNew, 68, 0)
      Y: =72
