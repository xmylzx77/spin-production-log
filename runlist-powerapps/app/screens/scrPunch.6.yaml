- btnPunG12S8:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =If(ThisItem.Need12, clrPage, clrText)
      DisabledColor: =Self.Color
      DisabledFill: =ColorFade(Self.Fill, -30%)
      Fill: =If(ThisItem.Need12 && ThisItem.Done12, clrGreen, ThisItem.Need12, clrYellow, clrGrey)
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Bold
      Height: =32
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =With({id: ThisItem.ID, v: !ThisItem.Need12},
            // A punched gauge can't be un-needed (app-spec). ThisItem can be up to 60 s old, so a
            // yellow pill re-reads the row before un-needing; grey and green pills skip that read.
            If(ThisItem.Need12 && (ThisItem.Done12 || LookUp(RunListJobs, ID = id).Done12),
                Notify("12 ga is already punched, so it stays selected.", NotificationType.Warning);
                If(!ThisItem.Done12, Refresh(RunListJobs); Set(gblRefreshTick, gblRefreshTick + 1)),
                IfError(
                    Patch(RunListJobs, LookUp(RunListJobs, ID = id), {Need12: v}),
                    Refresh(RunListJobs);
                    IfError(
                        Patch(RunListJobs, LookUp(RunListJobs, ID = id), {Need12: v}),
                        Notify("Save failed: " & FirstError.Message, NotificationType.Error, 0)
                    )
                )
            )
        )
      PaddingLeft: =0
      PaddingRight: =0
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =16
      RadiusBottomRight: =16
      RadiusTopLeft: =16
      RadiusTopRight: =16
      Size: =12
      Text: ="12"
      Width: =40
      X: =12 + 0 * 44
      Y: =36
