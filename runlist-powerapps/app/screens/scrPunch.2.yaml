- lblPunEdTitle:
    Control: Label@2.5.1
    Properties:
      Color: =clrText
      FontWeight: =FontWeight.Bold
      Height: =40
      PaddingBottom: =0
      PaddingLeft: =0
      PaddingRight: =0
      PaddingTop: =0
      Size: =20
      Text: |-
        =If(locPunEdMode = "add", "Add job", "Edit job " & locPunJob.JobNumber & If(!IsBlank(locPunJob.FanNumber), "-" & locPunJob.FanNumber))
      Width: =892
      Wrap: =false
      X: =24
      Y: =14
- lblPunEdStatus:
    Control: Label@2.5.1
    Properties:
      Color: =clrMuted
      Height: =24
      PaddingBottom: =0
      PaddingLeft: =0
      PaddingRight: =0
      PaddingTop: =0
      Size: =13
      Text: |-
        =If(locPunEdMode = "add",
            "New manual job. It goes on the board as Active.",
            "Status: " & locPunJob.JobStatus.Value & If(IsBlank(locPunJob.CasmfgId), "   ·   manual job", "   ·   from CASMFG, so Job # and Unit # are locked")
        )
      Width: =892
      Wrap: =false
      X: =24
      Y: =54
