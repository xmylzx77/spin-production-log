- btnPunEdClrPunch:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =clrText
      DisabledColor: =clrMuted
      DisabledFill: =ColorFade(clrGrey, -40%)
      DisplayMode: |-
        =If((locPunEdMode = "add" || locPunJob.JobStatus.Value = "Active"), DisplayMode.Edit, DisplayMode.Disabled)
      Fill: =clrGrey
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Semibold
      Height: =42
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =UpdateContext({locPunEdClrPunch: true});
        Reset(dpPunEdPunch)
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
