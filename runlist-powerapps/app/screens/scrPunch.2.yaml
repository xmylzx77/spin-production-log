- ddPunEdSize:
    Control: Classic/DropDown@2.3.1
    Properties:
      BorderColor: =clrBorder
      ChevronBackground: =clrGrey
      ChevronFill: =clrText
      Color: =clrText
      Default: |-
        =With({p: With({m: Match(Upper(locPunJob.ProductModel & ""), "CASRTU\s*(?<sz>\d+)")}, If(!IsBlank(m) && Value(m.sz) >= 1 && Value(m.sz) <= 4, Value(m.sz), Blank()))}, If(IsBlank(locPunJob.JobSize) || locPunJob.JobSize = p, "Auto", Text(locPunJob.JobSize)))
      Fill: =clrPage
      Height: =42
      HoverColor: =clrText
      HoverFill: =clrCard
      Items: =["Auto", "1", "2", "3", "4"]
      PressedColor: =clrText
      PressedFill: =clrCard
      SelectionColor: =clrWhite
      SelectionFill: =clrBlue
      Size: =15
      Width: =284
      X: =24
      Y: =252
