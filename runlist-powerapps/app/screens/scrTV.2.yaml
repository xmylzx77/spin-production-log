            PaddingTop: =0
            Size: =11
            Text: |-
              =With({n: ThisItem.C8 + ThisItem.C15},
                  With({jobs: If(n = 1, "1 job", n & " jobs")},
                      If(ThisItem.Slot > 1, "(continued)",
                          ThisItem.IsToday, "Today · " & jobs,
                          ThisItem.BandKey < TodayKey, "Overdue · " & jobs,
                          n = 0, "No jobs",
