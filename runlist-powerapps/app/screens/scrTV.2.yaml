                  Size: =13
                  Text: ="24"
                  Width: =44
                  X: =12 + 5 * 48
                  Y: =35
            - btnTvNestedS15:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =If(ThisItem.J15.Nested, clrPage, clrText)
                  Fill: =If(ThisItem.J15.Nested, clrGreen, clrGrey)
                  FocusedBorderThickness: =0
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  HoverColor: =Self.Color
                  HoverFill: =Self.Fill
                  PaddingBottom: =0
                  PaddingTop: =0
                  PressedColor: =Self.Color
                  PressedFill: =Self.Fill
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  Size: =13
                  Text: |-
                    =If(ThisItem.J15.Nested, "✓ Nested", "Not nested")
                  Width: =110
                  X: =304
                  Y: =35
      - lblTvEmptyS15:
          Control: Label@2.5.1
          Properties:
            Color: =clrMuted
            Height: =28
            Italic: =true
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingTop: =0
            Size: =14
            Text: ="No jobs"
            Visible: =(ThisItem.Slot = 1 || ThisItem.PageTop) && ThisItem.C15 = 0
            Width: =(Parent.TemplateWidth - 158) / 2
            Wrap: =false
            X: =(Parent.TemplateWidth - 158) / 2 + 158
            Y: =8
- tmrTvRefresh:
    Control: Timer@2.1.0
    Properties:
      AutoPause: =true
      AutoStart: =true
      Duration: =60000
      OnTimerEnd: |-
        =Refresh(TheWhiteBoard);
        Set(gblRefreshTick, gblRefreshTick + 1)
      Repeat: =true
      Visible: =false
- tmrTvPage:
    Control: Timer@2.1.0
    Properties:
      AutoPause: =true
      AutoStart: =true
      Duration: =30000
      OnTimerEnd: |-
        =UpdateContext({locTvPage: locTvPage + 1})
      Repeat: =true
      Visible: =false
