      - lblTvDayName:
          Control: Label@2.5.1
          Properties:
            Color: =If(!ThisItem.IsToday && ThisItem.BandKey < TodayKey, RGBA(252, 165, 165, 1), clrText)
            FontWeight: =FontWeight.Bold
            Height: =28
            PaddingBottom: =0
            PaddingLeft: =10
            PaddingTop: =0
            Size: =16
            Text: =ThisItem.Label
            Visible: =ThisItem.Slot = 1 || ThisItem.PageTop
