- galTvBoard:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      BorderThickness: =0
      DelayItemLoading: =false
      Fill: =clrNone
      Height: =648
      Items: |-
        =// One row = the k-th SB-8 and k-th SB-15 card of a day band (no Unscheduled band).
        // Bands: today and the next 5 days, plus every other day that holds a TV job, in date
        // order. Same days as Filter(PunchBandsOpen, BandKey > 0), built here so that a punch
        // day more than 400 days away still gets a row (scrTV notes, request R1).
        // A band takes Max(1, cards per machine) rows; only one page of 9 rows shows.
        With({perPage: 9, win: PunchWindow},
        With({extra: Filter(Distinct(Filter(ActiveJobs, !TurretDone && MachineText <> "" && PunchDayKey > 0), PunchDayKey) As u, IsBlank(LookUp(win, BandKey = u.Value)))},
        With({keys: SortByColumns(ForAll(Sequence(CountRows(win) + CountRows(extra)) As s,
                {K: If(s.Value <= CountRows(win), Index(win, s.Value).BandKey, Index(extra, s.Value - CountRows(win)).Value)}), "K", SortOrder.Ascending)},
        With({bands: ForAll(keys As b,
            With({d: Date(RoundDown(b.K / 10000, 0), Mod(RoundDown(b.K / 100, 0), 100), Mod(b.K, 100))},
            With({ymd: Text(d, "yyyy-mm-dd")},
            With({s8: SortByColumns(Filter(ActiveJobs, PunchBand = "SB8|" & ymd && !TurretDone), "PunchGroupOrder", SortOrder.Ascending, "PairKey", SortOrder.Ascending, "PunchSort", SortOrder.Ascending, "ID", SortOrder.Ascending),
                  s15: SortByColumns(Filter(ActiveJobs, PunchBand = "SB15|" & ymd && !TurretDone), "PunchGroupOrder", SortOrder.Ascending, "PairKey", SortOrder.Ascending, "PunchSort", SortOrder.Ascending, "ID", SortOrder.Ascending)},
                {BandKey: b.K, IsToday: b.K = TodayKey, S8: s8, S15: s15, RowCount: Max(1, CountRows(s8), CountRows(s15)),
                 Label: If(Abs(DateDiff(TodayDate, d, TimeUnit.Days)) > 400, Text(d, "m/d/yyyy", "en-US"), Text(d, "ddd mmm d", "en-US"))}
            ))))},
        With({starts: ForAll(Sequence(CountRows(bands)) As s,
            {FromRow: Coalesce(Sum(FirstN(bands, s.Value - 1), RowCount), 0) + 1, Band: Index(bands, s.Value)}
        )},
        With({allRows: ForAll(Sequence(Coalesce(Sum(bands, RowCount), 0)) As r,
            With({x: Last(Filter(starts, FromRow <= r.Value))},
            With({k: r.Value - x.FromRow + 1},
                {RowNo: r.Value, PageTop: Mod(r.Value - 1, perPage) = 0,
                 BandKey: x.Band.BandKey, Label: x.Band.Label, IsToday: x.Band.IsToday,
                 Slot: k, C8: CountRows(x.Band.S8), C15: CountRows(x.Band.S15),
                 J8: If(k <= CountRows(x.Band.S8), Index(x.Band.S8, k)),
                 J15: If(k <= CountRows(x.Band.S15), Index(x.Band.S15, k))}
            ))
        )},
        With({page: Mod(Coalesce(locTvPage, 0), Max(1, RoundUp(CountRows(allRows) / perPage, 0)))},
            Filter(allRows, RowNo > page * perPage && RowNo <= (page + 1) * perPage)
        )))))))
      LoadingSpinner: =LoadingSpinner.None
      ShowScrollbar: =false
      TemplatePadding: =0
      TemplateSize: =72
      Width: =1350
      X: =8
      Y: =108
    Children:
      - recTvDayBg:
          Control: Rectangle@2.3.0
          Properties:
            BorderThickness: =0
            Fill: |-
              =If(ThisItem.IsToday, RGBA(37, 99, 235, 0.45), ThisItem.BandKey < TodayKey, RGBA(239, 68, 68, 0.22), RGBA(51, 65, 85, 0.6))
            Height: =Parent.TemplateHeight
