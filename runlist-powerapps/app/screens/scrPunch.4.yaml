      Width: =140
      X: =300
      Y: =408
- btnPunPlConfirm:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =clrWhite
      DisabledColor: =Self.Color
      DisabledFill: =ColorFade(Self.Fill, -30%)
      Fill: =clrBlue
      FocusedBorderThickness: =0
      FontWeight: =FontWeight.Semibold
      Height: =48
      HoverColor: =Self.Color
      HoverFill: =ColorFade(Self.Fill, -10%)
      OnSelect: |-
        =With({j: LookUp(IncomingJobs, ID = locId), m: locPunPlaceMachine, d: dpPunPlDay.SelectedDate, cur: LookUp(TheWhiteBoard, ID = locId)},
            // cur is the row as it is on the server now: another device may have placed or dismissed it.
            If(IsBlank(j) || cur.JobStatus.Value <> "Incoming",
                Notify("This job is no longer in the Incoming tray (it was placed or dismissed on another device). Nothing was changed.", NotificationType.Warning);
                Refresh(TheWhiteBoard);
                Set(gblRefreshTick, gblRefreshTick + 1);
                Select(btnPunPlCancel),
                // Place: Active, machine, optional punch day, gauges, end of its band (band max + 1).
                With({id: j.ID,
                      ch: {JobStatus: {Value: "Active"}, Machine: {Value: m}, PunchDay: d,
                           PunchOrder: Coalesce(Max(Filter(ActiveJobs, PunchBand = m & "|" & If(IsBlank(d), "", Text(d, "yyyy-mm-dd"))), PunchSort), 0) + 1,
                           Need12: locPunP12, Need14: locPunP14, Need16: locPunP16, Need18: locPunP18, Need20: locPunP20, Need24: locPunP24}},
                    IfError(
                        Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), ch),
                        Refresh(TheWhiteBoard);
                        IfError(
                            Patch(TheWhiteBoard, LookUp(TheWhiteBoard, ID = id), ch),
                            Notify("Place failed: " & FirstError.Message, NotificationType.Error, 0),
                            Select(btnPunPlCancel)
                        ),
                        Select(btnPunPlCancel)
                    )
                )
            )
        )
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =15
      Text: ="Place on " & locPunPlaceMachine
      Width: =140
      X: =456
      Y: =408
