        =UpdateContext({locPanel: "", locId: 0});
        Reset(dpPunPlDay)
      PressedColor: =Self.Color
      PressedFill: =ColorFade(Self.Fill, -25%)
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =15
